<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practitioners - e-Referral Group 2 FHIR</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --nav-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.5;
        }

        header {
            background-color: var(--nav-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-color);
        }

        .nav-btn {
            background-color: var(--primary-color);
            color: #ffffff;
            border: none;
            padding: 0.5rem 1.25rem;
            font-size: 0.95rem;
            font-weight: 500;
            border-radius: 0.375rem;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            text-decoration: none;
            display: inline-block;
        }

        .nav-btn:hover {
            background-color: var(--primary-hover);
        }

        .nav-btn:active {
            transform: translateY(1px);
        }

        main {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 2rem;
        }

        .card {
            background-color: var(--nav-bg);
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        h2 {
            font-size: 1.15rem;
            margin-bottom: 1rem;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
            margin-bottom: 1rem;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 0.25rem;
        }

        input, select {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid var(--border-color);
            border-radius: 0.375rem;
            font-size: 0.95rem;
        }

        .form-actions {
            display: flex;
            gap: 0.75rem;
        }

        .secondary-btn {
            background-color: #ffffff;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 0.5rem 1.25rem;
            font-size: 0.95rem;
            font-weight: 500;
            border-radius: 0.375rem;
            cursor: pointer;
        }

        .secondary-btn:hover {
            background-color: var(--bg-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            text-align: left;
            padding: 0.6rem 0.5rem;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.9rem;
        }

        .action-btn {
            border: none;
            border-radius: 0.375rem;
            padding: 0.3rem 0.7rem;
            font-size: 0.85rem;
            cursor: pointer;
            margin-right: 0.4rem;
        }

        .edit-btn {
            background-color: #e2e8f0;
            color: var(--text-color);
        }

        .delete-btn {
            background-color: #fee2e2;
            color: #dc2626;
        }

        #status-message {
            min-height: 1.2rem;
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        .skeleton {
            display: inline-block;
            height: 0.85rem;
            border-radius: 0.25rem;
            background: linear-gradient(90deg, #e2e8f0 25%, #edf1f5 37%, #e2e8f0 63%);
            background-size: 400% 100%;
            animation: skeleton-loading 1.4s ease infinite;
        }

        .action-btn.skeleton {
            height: 1.6rem;
            width: 3.5rem;
            border-radius: 0.375rem;
            margin-right: 0.4rem;
        }

        @keyframes skeleton-loading {
            0% { background-position: 100% 50%; }
            100% { background-position: 0 50%; }
        }

        .pagination {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.75rem;
            margin-top: 1rem;
        }

        .pagination-info {
            font-size: 0.85rem;
            color: #64748b;
        }

        .pagination-buttons {
            display: flex;
            gap: 0.5rem;
        }

        .pagination-buttons button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .toolbar {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .search-box {
            flex: 1 1 260px;
            max-width: 360px;
        }

        .search-box label {
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 0.25rem;
        }

        .search-input {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid var(--border-color);
            border-radius: 0.375rem;
            font-size: 0.95rem;
        }

        .empty-state {
            text-align: center;
            color: #64748b;
            padding: 1.25rem 0.5rem;
        }
        .command-header { background: #102a43; border-bottom: 4px solid #18a88f; color: white; padding: 14px clamp(20px, 4vw, 58px); }
        .command-header .header-container { max-width: 1320px; gap: 20px; }
        .command-brand { align-items: center; display: flex; gap: 11px; }
        .command-brand-mark { align-items: center; background: #18a88f; border-radius: 11px; display: flex; font-size: 23px; font-weight: bold; height: 43px; justify-content: center; width: 43px; }
        .command-brand h1 { color: white; font-size: 14px; letter-spacing: .08em; margin: 0; }
        .command-brand p { color: #91a9bc; font-size: 11px; margin: 3px 0 0; }
        .command-nav { align-items: center; display: flex; flex: 1 1 auto; gap: 17px; overflow-x: auto; }
        .command-group { align-items: center; border-left: 1px solid rgba(255,255,255,.16); display: flex; gap: 4px; padding-left: 17px; }
        .command-label { color: #7891a5; font-size: 9px; font-weight: bold; letter-spacing: .13em; margin-right: 5px; text-transform: uppercase; white-space: nowrap; }
        .command-link { align-items: center; background: transparent; border: 1px solid transparent; border-radius: 7px; color: #c9d7e2; display: inline-flex; font-size: 13px; gap: 6px; padding: 9px 10px; text-decoration: none; white-space: nowrap; }
        .command-link:hover, .command-link.active { background: #1f4b61; border-color: #35667b; color: white; }
        .command-status { align-items: center; color: #a9c0ca; display: flex; font-size: 11px; gap: 7px; white-space: nowrap; }
        .command-status::before { background: #48d2ad; border-radius: 50%; box-shadow: 0 0 0 4px rgba(72,210,173,.12); content: ''; height: 8px; width: 8px; }
        @media (max-width: 900px) { .command-header .header-container { align-items: flex-start; } .command-nav { flex-basis: 100%; order: 3; } .command-group { border-left: 0; padding-left: 0; } }
        @media (max-width: 560px) { .command-label { display: none; } .command-status { margin-left: auto; } }
    </style>
</head>
<body>
    <header class="command-header">
        <div class="header-container">
            <div class="command-brand"><div class="command-brand-mark">+</div><div><h1>E-REFERRAL FHIR</h1><p>Group 2 workspace</p></div></div>
            <nav class="command-nav" aria-label="Main Navigation">
                <div class="command-group"><span class="command-label">Workspace</span><a href="../../index.html" class="command-link">⌂ Home</a><a href="../referral/index.html" class="command-link">↗ e-Referral</a></div>
                <div class="command-group"><span class="command-label">Directories</span><a href="../patient/PatientView.html" class="command-link">♙ Patients</a><a href="../Organization/OrganizationView.html" class="command-link">▦ Organizations</a><a href="PractitionerView.html" class="command-link active">⚕ Practitioners</a><a href="../practitioner_roles/index.html" class="command-link">▤ Practitioner Rules</a></div>
            </nav>
            <div class="command-status">FHIR R4 connected</div>
        </div>
    </header>
    <main>
        <div id="status-message"></div>

        <section class="card">
            <h2 id="form-title">Add Practitioner</h2>
            <form id="practitioner-form">
                <input type="hidden" name="practitioner-id">
                <div class="form-grid">
                    <div>
                        <label for="given">Given Name</label>
                        <input type="text" name="given" id="given">
                    </div>
                    <div>
                        <label for="family">Family Name</label>
                        <input type="text" name="family" id="family">
                    </div>
                    <div>
                        <label for="qualification">Qualification</label>
                        <input type="text" name="qualification" id="qualification" placeholder="e.g. Doctor of Medicine">
                    </div>
                    <div>
                        <label for="telecom-system">Telecom Type</label>
                        <select name="telecom-system" id="telecom-system">
                            <option value="phone">Phone</option>
                            <option value="email">Email</option>
                        </select>
                    </div>
                    <div>
                        <label for="telecom-value">Telecom Value</label>
                        <input type="text" name="telecom-value" id="telecom-value" placeholder="e.g. +63-917-000-0000">
                    </div>
                </div>
                <div class="form-actions">
                    <button type="submit" class="nav-btn">Save</button>
                    <button type="button" id="cancel-btn" class="secondary-btn">Cancel</button>
                </div>
            </form>
        </section>

        <section class="card">
            <h2>Practitioner List</h2>
            <div class="toolbar">
                <div class="search-box">
                    <label for="practitioner-search">Search</label>
                    <input type="text" id="practitioner-search" class="search-input"
                           placeholder="Search by name, qualification, or contact...">
                </div>
                <button type="button" id="clear-search-btn" class="secondary-btn">Clear</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Qualification</th>
                        <th>Telecom</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="practitioner-table-body"></tbody>
            </table>
            <div id="pagination-controls" class="pagination"></div>
        </section>
    </main>

    <script src="Practitioner.js"></script>
    <script src="PractitionerController.js"></script>
</body>
</html>
