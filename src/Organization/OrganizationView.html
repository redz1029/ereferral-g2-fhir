<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organizations - e-Referral Group 2 FHIR</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --nav-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.5;
        }

        header {
            background-color: var(--nav-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-color);
        }

        .nav-btn {
            background-color: var(--primary-color);
            color: #ffffff;
            border: none;
            padding: 0.5rem 1.25rem;
            font-size: 0.95rem;
            font-weight: 500;
            border-radius: 0.375rem;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            text-decoration: none;
            display: inline-block;
        }

        .nav-btn:hover {
            background-color: var(--primary-hover);
        }

        .nav-btn:active {
            transform: translateY(1px);
        }

        main {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 2rem;
        }

        .card {
            background-color: var(--nav-bg);
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        h2 {
            font-size: 1.15rem;
            margin-bottom: 1rem;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
            margin-bottom: 1rem;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 0.25rem;
        }

        input, select {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid var(--border-color);
            border-radius: 0.375rem;
            font-size: 0.95rem;
        }

        .form-actions {
            display: flex;
            gap: 0.75rem;
        }

        .secondary-btn {
            background-color: #ffffff;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 0.5rem 1.25rem;
            font-size: 0.95rem;
            font-weight: 500;
            border-radius: 0.375rem;
            cursor: pointer;
        }

        .secondary-btn:hover {
            background-color: var(--bg-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            text-align: left;
            padding: 0.6rem 0.5rem;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.9rem;
        }

        .action-btn {
            border: none;
            border-radius: 0.375rem;
            padding: 0.3rem 0.7rem;
            font-size: 0.85rem;
            cursor: pointer;
            margin-right: 0.4rem;
        }

        .edit-btn {
            background-color: #e2e8f0;
            color: var(--text-color);
        }

        .delete-btn {
            background-color: #fee2e2;
            color: #dc2626;
        }

        #status-message {
            min-height: 1.2rem;
            font-size: 0.9rem;
            margin-bottom: 1rem;
            font-weight: 500;
        }

        .skeleton {
            display: inline-block;
            height: 0.85rem;
            border-radius: 0.25rem;
            background: linear-gradient(90deg, #e2e8f0 25%, #edf1f5 37%, #e2e8f0 63%);
            background-size: 400% 100%;
            animation: skeleton-loading 1.4s ease infinite;
        }

        .action-btn.skeleton {
            height: 1.6rem;
            width: 3.5rem;
            border-radius: 0.375rem;
            margin-right: 0.4rem;
        }

        @keyframes skeleton-loading {
            0% { background-position: 100% 50%; }
            100% { background-position: 0 50%; }
        }

        #status-message {
            display: none; /* Hidden by default */
            padding: 0.85rem 1.25rem;
            border-radius: 0.375rem;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
            font-weight: 500;
            align-items: center;
            gap: 0.5rem;
            opacity: 0;
            transform: translateY(-10px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        #status-message.show {
            display: flex;
            opacity: 1;
            transform: translateY(0);
        }

        .status-success {
            background-color: #dcfce7;
            color: #166534;
            border: 1px solid #bbf7d0;
        }

        .status-error {
            background-color: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }
        
        .status-icon {
            font-size: 1.1rem;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-container">
            <h1>Organizations</h1>
            <a class="nav-btn" href="../../index.html">&larr; Back to Home</a>
        </div>
    </header>
    <main>
        <div id="status-message"></div>

        <section class="card">
            <h2 id="form-title">Add Organization</h2>
            <form id="org-form">
                <input type="hidden" id="org-id">
                
                <div class="form-grid">
                    <div style="grid-column: 1 / -1;">
                        <label for="org-name">Organization Name *</label>
                        <input type="text" id="org-name" required placeholder="e.g. General Santos Medical Center">
                    </div>
                    
                    <div>
                        <label for="org-nhfr">NHFR Code</label>
                        <input type="text" id="org-nhfr" placeholder="NHFR-12345">
                    </div>
                    <div>
                        <label for="org-hcpn">HCPN</label>
                        <input type="text" id="org-hcpn" placeholder="HCPN-67890">
                    </div>

                    <div>
                        <label for="org-phone">Phone Number</label>
                        <input type="text" id="org-phone" placeholder="e.g. +639123456789">
                    </div>
                    <div>
                        <label for="org-email">Email Address</label>
                        <input type="email" id="org-email" placeholder="email@hospital.com">
                    </div>
                </div>

                <h3 style="font-size: 0.95rem; margin-top: 1rem; margin-bottom: 0.5rem;">Address</h3>
                <div class="form-grid">
                    <div>
                        <label for="org-address">Street / Building</label>
                        <input type="text" id="org-address" placeholder="Street, Barangay">
                    </div>
                    <div>
                        <label for="org-city">City</label>
                        <input type="text" id="org-city" placeholder="City">
                    </div>
                    <div>
                        <label for="org-state">State / Province</label>
                        <input type="text" id="org-state" placeholder="Province">
                    </div>
                </div>

                <div class="form-actions" style="margin-top: 1rem;">
                    <button type="submit" class="nav-btn">Save</button>
                    <button type="button" id="cancel-btn" class="secondary-btn">Cancel</button>
                </div>
            </form>
        </section>

        <section class="card">
            <h2>Organization List</h2>
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>NHFR Code</th>
                        <th>HCPN</th>
                        <th>Address</th>
                        <th>Telecom</th>
                        <th style="text-align: center;">Actions</th>
                    </tr>
                </thead>
                <tbody id="org-table-body"></tbody>
            </table>
        </section>
    </main>

    <!-- Internal JS Script to match your Practitioner.js/PractitionerController.js architecture -->
    <script>
        const FHIR_BASE = 'https://cdr.pheref.fhirlab.net/fhir';
        let cachedOrganizations = [];

        // DOM Elements
        const statusMessage = document.getElementById('status-message');
        const formTitle = document.getElementById('form-title');
        const orgForm = document.getElementById('org-form');
        const tableBody = document.getElementById('org-table-body');

        // --- Notifications ---
        let statusTimeout;
        function showMessage(msg, isError = false) {
            clearTimeout(statusTimeout); // Clear existing timeout if clicking quickly
            
            // Reset classes
            statusMessage.className = '';
            
            // Set icon and text
            const icon = isError ? '⚠️' : '✅';
            statusMessage.innerHTML = `<span class="status-icon">${icon}</span> <span>${msg}</span>`;
            
            // Add color styling
            statusMessage.classList.add(isError ? 'status-error' : 'status-success');
            
            // Show with animation
            statusMessage.style.display = 'flex';
            // Slight delay to allow CSS transition to trigger
            requestAnimationFrame(() => {
                statusMessage.classList.add('show');
            });

            // Hide after 4 seconds
            statusTimeout = setTimeout(() => { 
                statusMessage.classList.remove('show');
                // Wait for the fade-out animation to finish before removing from layout
                setTimeout(() => {
                    if (!statusMessage.classList.contains('show')) {
                        statusMessage.style.display = 'none';
                    }
                }, 300);
            }, 4000);
        }

        // --- FHIR API Methods ---

        // Fetch organizations from FHIR server
        async function fetchOrganizations() {
            const response = await fetch(`${FHIR_BASE}/Organization?_sort=-_lastUpdated&_count=10`);
            if (!response.ok) throw new Error('Failed to load organizations');
            const bundle = await response.json();
            return (bundle.entry || []).map(entry => entry.resource);
        }

        // Save organization to FHIR server (POST for new, PUT for update)
        async function saveOrganizationToFHIR(orgFhir, method, url) {
            const response = await fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/fhir+json' },
                body: JSON.stringify(orgFhir)
            });
            if (!response.ok) throw new Error(`Failed to save organization (${response.status})`);
        }
        
        // Delete organization from FHIR server
        async function deleteOrganizationFromFHIR(id) {
            const response = await fetch(`${FHIR_BASE}/Organization/${id}`, { method: 'DELETE' });
            if (!response.ok) throw new Error(`Failed to delete organization`);
        }

        // --- UI Rendering ---
        function renderSkeletonRows() {
            tableBody.innerHTML = Array(5).fill(`
                <tr>
                    <td><span class="skeleton" style="width: 80%"></span></td>
                    <td><span class="skeleton" style="width: 60px"></span></td>
                    <td><span class="skeleton" style="width: 60px"></span></td>
                    <td><span class="skeleton" style="width: 90%"></span></td>
                    <td><span class="skeleton" style="width: 70px"></span></td>
                    <td>
                        <button class="action-btn skeleton"></button>
                        <button class="action-btn skeleton"></button>
                    </td>
                </tr>
            `).join('');
        }

        function renderTable() {
            tableBody.innerHTML = '';
            cachedOrganizations.forEach(org => {
                // Extract Identifiers
                const identifiers = org.identifier || [];
                const nhfr = identifiers.find(i => i.system?.includes('nhfr'))?.value || '-';
                const hcpn = identifiers.find(i => i.system?.includes('hcpn'))?.value || '-';
                
                // Extract Address
                const addrObj = org.address?.[0] || {};
                const addressStr = [addrObj.line?.join(', '), addrObj.city, addrObj.state].filter(Boolean).join(', ') || '-';

                // Extract Telecom
                const phone = (org.telecom || []).find(t => t.system === 'phone')?.value;
                const email = (org.telecom || []).find(t => t.system === 'email')?.value;
                const telecomStr = [phone, email].filter(Boolean).join('<br>') || '-';

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td style="font-weight: 500;">${org.name || '(No name)'}</td>
                    <td>${nhfr}</td>
                    <td>${hcpn}</td>
                    <td>${addressStr}</td>
                    <td>${telecomStr}</td>
                    <td style="white-space: nowrap;">
                        <button class="action-btn edit-btn" data-id="${org.id}">Edit</button>
                        <button class="action-btn delete-btn" data-id="${org.id}">Delete</button>
                    </td>
                `;
                tableBody.appendChild(row);
            });

            // Attach event listeners to buttons
            document.querySelectorAll('.edit-btn').forEach(btn => {
                btn.addEventListener('click', (e) => editOrganization(e.target.dataset.id));
            });
            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', (e) => deleteOrganization(e.target.dataset.id));
            });
        }

        async function loadOrganizations() {
            renderSkeletonRows();
            try {
                cachedOrganizations = await fetchOrganizations();
                renderTable();
            } catch (error) {
                showMessage(error.message, true);
                tableBody.innerHTML = '<tr><td colspan="6">Failed to load data.</td></tr>';
            }
        }

        // --- Form Handling ---
        function clearForm() {
            orgForm.reset();
            document.getElementById('org-id').value = '';
            formTitle.textContent = 'Add Organization';
        }

        document.getElementById('cancel-btn').addEventListener('click', clearForm);

        function editOrganization(id) {
            const org = cachedOrganizations.find(o => o.id === id);
            if (!org) return;

            document.getElementById('org-id').value = org.id;
            document.getElementById('org-name').value = org.name || '';

            // Map Identifiers
            const identifiers = org.identifier || [];
            document.getElementById('org-nhfr').value = identifiers.find(i => i.system?.includes('nhfr'))?.value || '';
            document.getElementById('org-hcpn').value = identifiers.find(i => i.system?.includes('hcpn'))?.value || '';

            // Map Address
            const addr = (org.address && org.address.length > 0) ? org.address[0] : {};
            document.getElementById('org-address').value = (addr.line && addr.line.join(', ')) || '';
            document.getElementById('org-city').value = addr.city || '';
            document.getElementById('org-state').value = addr.state || '';

            // Map Telecom
            document.getElementById('org-phone').value = (org.telecom || []).find(t => t.system === 'phone')?.value || '';
            document.getElementById('org-email').value = (org.telecom || []).find(t => t.system === 'email')?.value || '';

            formTitle.textContent = 'Edit Organization';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        orgForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const id = document.getElementById('org-id').value;
            
            // Build FHIR JSON
            const orgFhir = {
                resourceType: "Organization",
                name: document.getElementById('org-name').value.trim(),
                identifier: [],
                address: [{
                    line: document.getElementById('org-address').value.trim() ? [document.getElementById('org-address').value.trim()] : [],
                    city: document.getElementById('org-city').value.trim(),
                    state: document.getElementById('org-state').value.trim()
                }],
                telecom: []
            };

            if (id) orgFhir.id = id;

            const nhfr = document.getElementById('org-nhfr').value.trim();
            const hcpn = document.getElementById('org-hcpn').value.trim();
            if (nhfr) orgFhir.identifier.push({ system: "http://phie.doh.gov.ph/nhfr", value: nhfr });
            if (hcpn) orgFhir.identifier.push({ system: "http://phie.doh.gov.ph/hcpn", value: hcpn });

            const phone = document.getElementById('org-phone').value.trim();
            const email = document.getElementById('org-email').value.trim();
            if (phone) orgFhir.telecom.push({ system: "phone", value: phone });
            if (email) orgFhir.telecom.push({ system: "email", value: email });

            try {
                if (id) {
                    await saveOrganizationToFHIR(orgFhir, 'PUT', `${FHIR_BASE}/Organization/${id}`);
                    showMessage('Organization updated successfully.');
                } else {
                    await saveOrganizationToFHIR(orgFhir, 'POST', `${FHIR_BASE}/Organization`);
                    showMessage('Organization created successfully.');
                }
                clearForm();
                await loadOrganizations();
            } catch (error) {
                showMessage(error.message, true);
            }
        });

        async function deleteOrganization(id) {
            if (!confirm('Are you sure you want to delete this organization?')) return;
            try {
                await deleteOrganizationFromFHIR(id);
                showMessage('Organization deleted successfully.');
                await loadOrganizations();
            } catch (error) {
                showMessage(error.message, true);
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', loadOrganizations);
    </script>
</body>
</html>
