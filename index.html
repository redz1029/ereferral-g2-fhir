<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>e-Referral Group 2 FHIR</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --nav-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.5;
        }

        header {
            background-color: var(--nav-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-color);
        }

        nav {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .nav-btn {
            background-color: var(--primary-color);
            color: #ffffff;
            border: none;
            padding: 0.5rem 1.25rem;
            font-size: 0.95rem;
            font-weight: 500;
            border-radius: 0.375rem;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            text-decoration: none;
            display: inline-block;
        }

        .nav-btn:hover {
            background-color: var(--primary-hover);
        }

        .nav-btn:active {
            transform: translateY(1px);
        }

        main {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 2rem;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-container">
            <h1>e-Referral Group 2 FHIR</h1>
            <nav aria-label="Main Navigation">
                <a href="index.html" class="nav-btn" id="btn-patient">Patient</a>
                <a href="src/Organization/OrganizationView.html" class="nav-btn" id="btn-organization">Organization</a>
                <a href="src/practitioner/PractitionerView.html" class="nav-btn" id="btn-practitioners">Practitioner</a>
                <a href="src/practitioner_roles/index.html" class="nav-btn" id="btn-practitioner-roles">Practitioner Roles</a>
            </nav>
        </div>
    </header>
    <main>
        <!-- Content sections can be loaded or rendered here -->
    </main>
</body>
</html>
